name: ci

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Includes the performance regression tests (db::perf_tests, the
      # key-repeat/search-latency tests in rsclip-ui, and the headless UI
      # test, which drives the real window on a private weston and fails if
      # the GTK thread stalls).
      - name: Run tests
        run: |
          docker run --rm \
            -v "$PWD":/work \
            -w /work \
            archlinux:base-devel \
            bash -lc '
              pacman -Syu --noconfirm --needed \
                base-devel \
                cargo \
                gtk4 \
                gtk4-layer-shell \
                gtksourceview5 \
                rust \
                ttf-dejavu \
                weston
              RSCLIP_REQUIRE_HEADLESS_UI=1 cargo test --workspace --locked
            '
